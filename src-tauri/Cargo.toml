[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.1", features = [] }

[dependencies]
serde_json = "1.0"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.8.5", features = ["unstable", "devtools"] }
tauri-plugin-log = "2.7.0"
tauri-plugin-shell = "2.3.1"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2.9.0", features = ["rustls-tls"] }
anyhow = "1.0.100"
urlencoding = "2.1.3"
tauri-plugin-global-shortcut = "2.3.1"
reqwest = { version = "0.11", features = ["blocking", "rustls-tls", "stream", "json"], default-features = false }
tauri-plugin-printer-v2 = "0.2.4"
webview2-com = "0.38.2"
windows-core = "0.61"
windows = "0.61"
tauri-plugin-single-instance = "2.4.0"
# Local database for the Rust offline mode (bundled = no system SQLite needed on store PCs).
rusqlite = { version = "0.32", features = ["bundled"] }
# The local /api "front door" in front of the Python backend (Rust offline mode, milestone 1).
axum = "0.8"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "time"] }
# Checking offline logins against the scrambled copies (PBKDF2-HMAC-SHA256), Rust offline mode piece 2.
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
