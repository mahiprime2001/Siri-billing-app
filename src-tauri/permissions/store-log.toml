# Lets the web side write into the store-events log and enable log shipping.
# Without these the ACL silently blocks both commands (see lib/store-log.ts).

[[permission]]
identifier = "allow-write-store-log"
description = "Allows invoking the write_store_log command"
commands.allow = ["write_store_log"]

[[permission]]
identifier = "allow-set-log-context"
description = "Allows invoking the set_log_context command"
commands.allow = ["set_log_context"]
